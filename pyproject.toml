[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ownerlens"
version = "0.1.0"
description = "Find cloud resources nobody owns: infer the owner, score how unused they are, and ask before touching anything."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nikhilrai-tech" }]
readme = "README.md"
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8", "moto[ec2,s3,cloudwatch,cloudtrail,sts]>=5"]

[project.scripts]
ownerlens = "ownerlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
